# DocuMaster PDF Studio — build per App Store e Play Store (modello: OmniTransit).
# iOS: profilo App Store in ios/profiles (creato via API App Store Connect).
# Android: keystore "documaster_android" da caricare su Codemagic (Code signing identities).
# Nessun trigger automatico: le build si avviano a mano.
workflows:
  ios-app-store:
    name: DocuMaster iOS App Store
    max_build_duration: 90
    instance_type: mac_mini_m4
    integrations:
      app_store_connect: Ikonet Solutions
    environment:
      ios_signing:
        # Il certificato è su Codemagic; il profilo App Store di DocuMaster è nel repo (ios/profiles) e viene
        # installato da uno script. Codemagic richiede almeno un profilo qui: quello di FuelSaver serve solo a
        # questo, `xcode-project use-profiles` sceglie il profilo con il bundle id corrispondente.
        provisioning_profiles:
          - fuelsaver_appstore
        certificates:
          - ithelpdesk_distribution_20260916
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      xcode: latest
      node: 22
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Check translations
        script: node scripts/check-i18n.mjs
      - name: Build web app and sync iOS project
        script: |
          npm run build
          npx cap sync ios
      - name: Install App Store provisioning profile
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          for f in ios/profiles/*.mobileprovision; do
            UUID=$(security cms -D -i "$f" | plutil -extract UUID raw -)
            cp "$f" "$PROFILES_DIR/$UUID.mobileprovision"
          done
      - name: Set up signing profiles
        script: xcode-project use-profiles
      - name: Apply Codemagic build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA for App Store Connect
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  android-release:
    name: DocuMaster Android
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      android_signing:
        - documaster_android
      vars:
        PACKAGE_NAME: "com.ikonet.documaster"
      node: 22
      java: 21
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web app and sync Android project
        script: |
          npm run build
          npx cap sync android
      - name: Set Android SDK location
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build release AAB
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
