# /etc/nginx/conf.d/pdf-ratelimit.conf — limiti per offlinepdfstudio.com (vedi deploy/nginx-pdf.conf)
# 5 pagine al secondo per IP con picchi fino a 40: una persona non ci arriva mai, uno scraper sì.
limit_req_zone $binary_remote_addr zone=pdf_pages:10m rate=5r/s;
# Al massimo 40 connessioni contemporanee per IP
limit_conn_zone $binary_remote_addr zone=pdf_conn:10m;
