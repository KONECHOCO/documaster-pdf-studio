# pdf.ikonetsolutions.com â versione web di DocuMaster (statica: tutto gira nel browser)
# Installato su ivoiro-server: /etc/nginx/sites-available/pdf â sites-enabled. HTTPS con certbot.
server {
    listen 80;
    listen [::]:80;
    server_name pdf.ikonetsolutions.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.ikonetsolutions.com;
    ssl_certificate /etc/letsencrypt/live/pdf.ikonetsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.ikonetsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/documaster;
    index index.html;

    # Log solo di questo sito: li legge deploy/stats/documaster_stats.py (report su Telegram)
    access_log /var/log/nginx/documaster.log;

    # Segnale anonimo "strumento aperto" inviato dall'app web
    location = /e {
        add_header Cache-Control "no-store";
        return 204;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # File con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Il worker di pdf.js è un modulo .mjs: va servito come JavaScript
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        try_files $uri =404;
    }
}
