# pdf.ikonetsolutions.com — versione web di DocuMaster (statica: tutto gira nel browser)
# Installato su ivoiro-server: /etc/nginx/sites-available/pdf → sites-enabled. HTTPS con certbot.
server {
    listen 80;
    listen [::]:80;
    server_name pdf.ikonetsolutions.com;
    root /var/www/documaster;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # File con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Il worker di pdf.js � un modulo .mjs: va servito come JavaScript
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        try_files $uri =404;
    }
}
