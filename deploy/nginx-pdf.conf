# Versione web di DocuMaster (statica: tutto gira nel browser) su ivoiro-server.
# Installato in /etc/nginx/sites-available/pdf (collegato in sites-enabled). Certificati Let's Encrypt
# ottenuti con: certbot certonly --webroot -w /var/www/html -d <dominio> (l'installer nginx di certbot non legge questo file).
#
# - offlinepdfstudio.com: il sito (dominio principale, approvato su AdSense)
# - www.offlinepdfstudio.com: rimanda al dominio principale
# - pdf.ikonetsolutions.com: vecchio indirizzo. Rimanda al nuovo, ma serve ancora direttamente
#   app-ads.txt, privacy e supporto: sono gli indirizzi registrati negli store e in AdMob.

server {
    listen 80;
    listen [::]:80;
    server_name offlinepdfstudio.com www.offlinepdfstudio.com pdf.ikonetsolutions.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.offlinepdfstudio.com;
    ssl_certificate /etc/letsencrypt/live/offlinepdfstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offlinepdfstudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/documaster.log;
    return 301 https://offlinepdfstudio.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pdf.ikonetsolutions.com;
    ssl_certificate /etc/letsencrypt/live/pdf.ikonetsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdf.ikonetsolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/documaster;
    access_log /var/log/nginx/documaster.log;

    location ~ ^/(app-ads\.txt|ads\.txt|privacy\.html|support\.html|favicon\.svg)$ {
        try_files $uri =404;
    }
    location / {
        return 301 https://offlinepdfstudio.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name offlinepdfstudio.com;
    ssl_certificate /etc/letsencrypt/live/offlinepdfstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offlinepdfstudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/documaster;
    index index.html;

    # Log solo di questo sito: li legge deploy/stats/documaster_stats.py (report su Telegram)
    access_log /var/log/nginx/documaster.log;

    # Protezione dai programmi automatici:
    # - gli indirizzi tipici degli scanner (.git, .env, WordPress, PHP…) vengono chiusi senza risposta;
    # - pagine e segnali hanno un limite di richieste per IP (i file statici in /assets e /vendor no:
    #   una visita normale ne scarica decine in un attimo).
    location ~* (^|/)\.(git|env|svn|aws|ssh|DS_Store)|wp-(admin|login|content|includes)|xmlrpc|\.php$|/phpmyadmin|/cgi-bin|/actuator|/server-status|\.(sql|bak|zip|tar|gz)$ {
        access_log /var/log/nginx/documaster.log;
        return 444;
    }
    limit_req_status 429;
    limit_conn pdf_conn 40;

    # Segnale anonimo "strumento aperto" inviato dall'app web
    location = /e {
        limit_req zone=pdf_pages burst=40 nodelay;
        add_header Cache-Control "no-store";
        return 204;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # File con hash nel nome: cache lunga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        limit_req zone=pdf_pages burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }
    # Il worker di pdf.js è un modulo .mjs: va servito come JavaScript
    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        try_files $uri =404;
    }
}
